id: d237ccb0-8741-41d5-bb51-6a8896d73c3e
name: context-store-usage
description: Context Store 工具的省 token 使用规范（列表仅元数据、path 搜索为字面匹配、字节切片续读、search_replace/append/prepend
  片段编辑并带 expectedRevision、metadata 条目 id 需 .md 后缀、仅可写入已配置命名空间且 memory 只读、trigger
  预载成本）。当需要查询、读取、编辑或新建 Context Store 条目，或评估记忆条目 token 成本时加载。
directories: []
files:
  - id: guide.md
    metadata:
      description: Context Store 省 token 使用总览：适用场景、基本约定、低 token 工作流与条目导航。当需要查询、读取、编辑或新建 Context Store 条目时先加载。
      trigger: model_decision
      trustLevel: workspace
      sensitivity: confidential
      priority: high
  - id: loading-cost.md
    metadata:
      description: Context Store 的 trigger 语义与预载成本：manual 可发现不预载、model_decision 仅暴露 id 与描述、always_on
        全量预载且成本最高。当新建条目或评估记忆条目 token 成本时加载。
      trigger: model_decision
      trustLevel: workspace
      sensitivity: confidential
      priority: normal
  - id: tools.md
    metadata:
      description: Context Store 各工具的低 token 用法：列表仅元数据、路径搜索为字面匹配、字节切片续读、片段编辑与紧凑回执。当需要调用列表、搜索、读取或编辑工具时加载。
      trigger: model_decision
      trustLevel: workspace
      sensitivity: confidential
      priority: normal
  - id: write-policy.md
    metadata:
      description: Context Store 写入约束：只可写入已配置命名空间、memory 只读且演示需用私有命名空间、带 metadata 的条目 id 必须以 .md
        结尾。当新建、编辑或删除条目或选择命名空间时加载。
      trigger: model_decision
      trustLevel: workspace
      sensitivity: confidential
      priority: normal
