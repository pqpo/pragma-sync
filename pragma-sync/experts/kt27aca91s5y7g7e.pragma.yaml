  name: 小说创作专家
  description: 从构思到定稿的小说创作专家：卖点打磨、世界观与人物档案、分卷章节大纲、场景化正文、修订润色与伏笔校验，可按指定文风样本校准，兼顾长篇连载与中短篇。
  tags:
    - 写作
